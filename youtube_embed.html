<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>wdj youtube embed</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  iframe { width: 100%; height: 100%; display: block; border: 0; }
</style>
</head>
<body>
<script>
// ---------------------------------------------------------------------
// Replacement embed page for wyozi's medialib "youtube" service.
// Loaded inside GMod's hidden DHTML panel. Talks to Lua via:
//   - window.medialibDelegate.run(name, args)  <- called FROM Lua
//   - medialiblua.Event(name, jsonString)      -> called INTO Lua
//
// v2: does NOT load the official youtube.com/iframe_api script anymore -
// its internally lazy-loaded sub-chunks failed to load inside GMod's
// HTML panel. Talks directly to a bare YouTube embed <iframe> using the
// raw, documented postMessage protocol instead (much smaller surface,
// nothing extra to fetch beyond the iframe itself).
// ---------------------------------------------------------------------

var pendingCommands = [];
var currentVolume = 1; // 0..1, matches medialib's volume range

// Defined FIRST and unconditionally, before anything that could throw,
// so Lua always has something to call even if the iframe/player below
// fails for some reason.
window.medialibDelegate = {
  run: function (name, args) {
    var cmd = { name: name, args: args || {} };
    if (!playerReady) {
      pendingCommands.push(cmd);
    } else {
      runCommandNow(cmd);
    }
  }
};

var params = new URLSearchParams(location.search);
var videoId = params.get('id');

var iframe = null;
var playerReady = false;
var wantsUnmuteAfterPlay = false;

function sendEvent(name, data) {
  if (window.medialiblua && medialiblua.Event) {
    medialiblua.Event(name, JSON.stringify(data || {}));
  }
}

function sendCommand(func, args) {
  if (!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [] }), '*');
}

function runCommandNow(cmd) {
  if (cmd.name === 'play') {
    wantsUnmuteAfterPlay = true;
    sendCommand('playVideo');
  } else if (cmd.name === 'pause') {
    sendCommand('pauseVideo');
  } else if (cmd.name === 'seek') {
    sendCommand('seekTo', [cmd.args.time, true]);
  } else if (cmd.name === 'setVolume') {
    currentVolume = cmd.args.vol;
    sendCommand('setVolume', [Math.round(currentVolume * 100)]);
  } else if (cmd.name === 'setQuality') {
    // YouTube deprecated manual quality control; best-effort only
    var q = cmd.args.quality === 'veryhigh' ? 'hd1080' : cmd.args.quality;
    sendCommand('setPlaybackQuality', [q]);
  }
}

function markReady() {
  if (playerReady) return;
  playerReady = true;
  sendCommand('setVolume', [Math.round(currentVolume * 100)]);
  sendEvent('playerLoaded', {});
  var queue = pendingCommands;
  pendingCommands = [];
  queue.forEach(runCommandNow);
}

var errorMessages = {
  2: 'Ungueltige Video-ID',
  5: 'HTML5-Player-Fehler',
  100: 'Video nicht gefunden oder entfernt',
  101: 'Einbettung vom Ersteller deaktiviert',
  150: 'Einbettung vom Ersteller deaktiviert'
};

window.addEventListener('message', function (e) {
  if (iframe && e.source !== iframe.contentWindow) return;
  if (typeof e.data !== 'string') return;
  var data;
  try {
    data = JSON.parse(e.data);
  } catch (err) {
    return;
  }
  if (!data || !data.event) return;

  if (data.event === 'onReady' || data.event === 'initialDelivery') {
    markReady();
  } else if (data.event === 'onStateChange' || data.event === 'infoDelivery') {
    var state = data.info;
    if (state && typeof state === 'object') state = state.playerState;
    if (state === 1) {
      if (wantsUnmuteAfterPlay) {
        sendCommand('unMute');
        sendCommand('setVolume', [Math.round(currentVolume * 100)]);
        wantsUnmuteAfterPlay = false;
      }
      sendEvent('stateChange', { state: 'playing' });
    } else if (state === 2) {
      sendEvent('stateChange', { state: 'paused' });
    } else if (state === 3) {
      sendEvent('stateChange', { state: 'buffering' });
    } else if (state === 0) {
      sendEvent('stateChange', { state: 'ended' });
    }
  } else if (data.event === 'onError') {
    sendEvent('error', { message: errorMessages[data.info] || ('Fehlercode ' + data.info) });
  }
});

try {
  var origin = encodeURIComponent(location.origin || '');
  var src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) +
    '?enablejsapi=1&autoplay=0&mute=1&controls=0&disablekb=1&fs=0' +
    '&modestbranding=1&playsinline=1&rel=0&iv_load_policy=3&origin=' + origin;

  iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.setAttribute('allow', 'autoplay');
  document.body.appendChild(iframe);

  iframe.addEventListener('load', function () {
    // give the embedded player a moment to attach its own message listener,
    // then treat it as ready even if we never see a clean onReady message
    setTimeout(markReady, 500);
  });
} catch (err) {
  sendEvent('error', { message: 'Init-Fehler: ' + err.message });
}
</script>
</body>
</html>
